project:
  type: website
  execute-dir: project
  post-render: _helpers/og_url.py
  resources:
    - images/duckboost-banner.png
    - images/apple-touch-icon.png

website:
  title: "duckboost"
  description: "SQL-native histogram GBDT in DuckDB — train, score, import vendor dumps, export plain SQL."
  # no trailing slash: Quarto joins it with the leading "/" of project-relative image paths
  site-url: https://javorraca.github.io/duckboost
  repo-url: https://github.com/JavOrraca/duckboost
  repo-actions: [edit, issue]
  favicon: images/favicon.png
  image: /images/duckboost-banner.png
  image-alt: "duckboost: SQL-native gradient-boosted trees in DuckDB"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  sidebar:
    logo: images/duckboost-hex.svg
    logo-alt: duckboost hex logo
    title: false
    style: docked
    search: true
    contents:
      - text: Overview
        href: index.qmd
      - text: Use cases and choosing a trainer
        href: use-cases.qmd
      - text: Getting started
        href: getting-started.qmd
      - text: Native vs LightGBM benchmark
        href: benchmarks.qmd
      - section: Vignettes
        contents:
          - text: Native histogram trainer
            href: vignettes/native-trainer.qmd
          - text: Train, predict, export
            href: vignettes/train-predict-export.qmd
          - text: Splitting data and preprocessing
            href: vignettes/split-and-preprocess.qmd
          - text: "Example datasets: iris and penguins"
            href: vignettes/datasets.qmd
          - text: Local ticket NLP (quackformers)
            href: vignettes/support-tickets-text.qmd
          - text: Import model dumps
            href: vignettes/import-dumps.qmd
          - text: Prediction intervals
            href: vignettes/prediction-intervals.qmd
      - text: SQL reference
        href: reference.qmd

format:
  html:
    # dark is listed first so it is the default; the toggle switches to light.
    theme:
      dark: [darkly, theme/duckdb-common.scss, theme/duckdb-dark.scss]
      light: [cosmo, theme/duckdb-common.scss, theme/duckdb-light.scss]
    highlight-style: github
    include-in-header: _includes/apple-touch-icon.html
    toc: true
    code-copy: true

execute:
  freeze: auto
