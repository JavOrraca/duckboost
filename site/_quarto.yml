project:
  type: website
  execute-dir: project
  resources:
    - images/duckboost-social.png

website:
  title: "duckboost"
  description: "Gradient-boosted trees, trained and scored in DuckDB SQL."
  site-url: https://javorraca.github.io/duckboost/
  repo-url: https://github.com/JavOrraca/duckboost
  repo-actions: [edit, issue]
  favicon: images/favicon.png
  # absolute, because Quarto resolves a relative image against each page (vignettes/images/... 404s)
  image: https://javorraca.github.io/duckboost/images/duckboost-social.png
  image-alt: "duckboost: gradient-boosted trees, trained and scored in DuckDB SQL"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  sidebar:
    logo: images/duckboost-hex.svg
    logo-alt: duckboost hex logo
    title: false
    style: docked
    search: true
    contents:
      - text: Overview
        href: index.qmd
      - text: Use cases and choosing a trainer
        href: use-cases.qmd
      - text: Getting started
        href: getting-started.qmd
      - section: Vignettes
        contents:
          - text: Train, predict, export
            href: vignettes/train-predict-export.qmd
          - text: Splitting data and preprocessing
            href: vignettes/split-and-preprocess.qmd
          - text: "Example datasets: iris and penguins"
            href: vignettes/datasets.qmd
          - text: Import model dumps
            href: vignettes/import-dumps.qmd
      - text: SQL reference
        href: reference.qmd

format:
  html:
    # dark is listed first so it is the default; the toggle switches to light.
    theme:
      dark: [darkly, theme/duckdb-common.scss, theme/duckdb-dark.scss]
      light: [cosmo, theme/duckdb-common.scss, theme/duckdb-light.scss]
    highlight-style: github
    include-in-header: _includes/social-image-size.html
    toc: true
    code-copy: true

execute:
  freeze: auto
