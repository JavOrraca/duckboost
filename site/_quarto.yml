project:
  type: website
  execute-dir: project
  post-render: _helpers/og_url.py
  resources:
    - field-guide/**
    - images/duckboost-banner.png
    - images/apple-touch-icon.png
    - images/favicon.png
    - images/duckboost-hex.svg

website:
  title: "duckboost"
  description: "SQL-native histogram gradient-boosted decision trees (“GBDT”) in DuckDB — train, score, import vendor dumps, export plain SQL."
  # no trailing slash: Quarto joins it with the leading "/" of project-relative image paths
  site-url: https://javorraca.github.io/duckboost
  repo-url: https://github.com/JavOrraca/duckboost
  repo-actions: [edit, issue]
  favicon: field-guide/assets/favicon.png
  image: /field-guide/assets/share.png
  image-alt: "Train trees. Ship SQL. A golden duck leaves a branching wake beside the duckboost headline."
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search:
    location: navbar
    type: overlay
  navbar:
    logo: field-guide/assets/duck-mark.svg
    logo-alt: duckboost home
    collapse: false
    title: duckboost
    pinned: true
    right:
      - text: Guides
        href: guides.qmd
      - text: Reference
        href: reference.qmd
      - text: Changelog
        href: changelog.qmd
      - text: GitHub
        href: https://github.com/JavOrraca/duckboost

format:
  html:
    theme:
      light: [cosmo, theme/duckdb-common.scss, theme/duckdb-light.scss]
      dark: [darkly, theme/duckdb-common.scss, theme/duckdb-dark.scss]
    css: field-guide/assets/fonts.css
    highlight-style: theme/field-guide.theme
    include-in-header: _includes/apple-touch-icon.html
    toc: true
    code-copy: true

# Pages run their SQL through ../build/release/duckdb on every render (no freeze),
# so the published output always matches the code on main.
execute:
  freeze: false
