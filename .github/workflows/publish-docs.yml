# Publish the Quarto site in site/ with GitHub's Pages deployment.
# Pages is configured to build and deploy from GitHub Actions (not a gh-pages branch).
#
# Executable examples are stored in site/_freeze. With execute.freeze: auto, any edit to a
# page that contains ```{python} cells invalidates that page's freeze and Quarto will try
# to re-run the cells. Pages that call site/_helpers/duckrun.py need the release DuckDB
# binary, which this workflow does not build. After changing those pages, refresh freeze
# locally and commit site/_freeze/** before merging to main (see PACKAGING.md).
name: Publish docs
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'scripts/check_site_freeze.py'
      - '.github/workflows/publish-docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check_site_freeze.py'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze-check:
    name: Check site freeze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check committed freeze for executable pages
        run: python3 scripts/check_site_freeze.py

  build:
    name: Render site
    needs: freeze-check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Quarto's jupyter engine imports nbformat even when freeze hits some pages; pure-Python
      # pages (e.g. benchmarks.qmd) may also re-execute without DuckDB.
      - name: Install Jupyter for Quarto
        run: python3 -m pip install --upgrade pip jupyter nbformat nbclient ipykernel

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Render Quarto project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
