#
# Calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension.
# Pin the release engine and its tested extension tooling.
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'EXTRACT_SOURCE.txt'
      - 'site/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'EXTRACT_SOURCE.txt'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@43dae9ec2b843bf9c6200ea4bbe5ad703cd01f77
    with:
      # Engine ABI label for the release artifacts.
      duckdb_version: v2.0.1
      # Exact checkout SHA for the v2.0.1 release tag.
      duckdb_commit: 8d78114e90a53823803660bf821f6073ac87da8c
      ci_tools_version: 43dae9ec2b843bf9c6200ea4bbe5ad703cd01f77
      extension_name: duckboost

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@43dae9ec2b843bf9c6200ea4bbe5ad703cd01f77
    with:
      duckdb_version: v2.0.1
      ci_tools_version: 43dae9ec2b843bf9c6200ea4bbe5ad703cd01f77
      extension_name: duckboost
      format_checks: 'format'
