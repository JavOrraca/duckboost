#
# Calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension.
# Pins match duckdb/community-extensions build.yml (DuckDB 2.0 alpha track).
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'EXTRACT_SOURCE.txt'
      - 'site/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'EXTRACT_SOURCE.txt'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # Commit to check out (community-extensions DUCKDB_LATEST_STABLE / duckdb_version).
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      # Version directory / footer label community deploys under (duckdb_tag).
      # Until duckdb/extension-ci-tools#439 lands on v2.0-cyanoptera, CI may still
      # stamp the commit into the footer; local `make` sets DUCKDB_VERSION correctly.
      duckdb_tag: v2.0.0-alpha46057
      ci_tools_version: v2.0-cyanoptera
      extension_name: duckboost

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      ci_tools_version: v2.0-cyanoptera
      extension_name: duckboost
      format_checks: 'format'
