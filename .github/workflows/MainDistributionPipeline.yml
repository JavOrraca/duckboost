#
# Calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension.
# Pins match duckdb/community-extensions build.yml (DuckDB 2.0.0 LTS).
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'EXTRACT_SOURCE.txt'
      - 'site/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'EXTRACT_SOURCE.txt'
      - 'site/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # Version label + deploy path (community DUCKDB_LATEST_STABLE).
      duckdb_version: v2.0.0
      # Exact checkout SHA for the v2.0.0 release tag.
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: duckboost

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: duckboost
      format_checks: 'format'
